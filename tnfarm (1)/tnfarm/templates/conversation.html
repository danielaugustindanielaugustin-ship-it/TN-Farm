{% extends "base.html" %}
{% block title %}Chat with {{ partner.name }}{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
  <h2>Chat with {{ partner.name }}</h2>
  <div class="card" style="padding:16px; min-height:300px; margin-bottom:16px;">
    {% for m in thread %}
      <div style="margin-bottom:10px; text-align:{{ 'right' if m.sender_id == current_user.id else 'left' }};">
        <span style="display:inline-block; padding:8px 14px; border-radius:16px; background:{{ '#2e7d32' if m.sender_id == current_user.id else '#f4f6f2' }}; color:{{ 'white' if m.sender_id == current_user.id else '#333d30' }}; max-width:75%;">
          {{ m.body }}
        </span>
        <div style="font-size:11px; color:#7a8577;">{{ m.created_at.strftime('%d %b, %I:%M %p') }}</div>
      </div>
    {% else %}
      <p class="empty">Say hello to start the conversation.</p>
    {% endfor %}
  </div>
  <form method="post" class="comment-form" style="background:white; border-radius:12px; border:1px solid #eef0ea;">
    <input type="text" name="body" placeholder="Type a message..." required autofocus>
    <button class="btn btn-primary" type="submit">Send</button>
  </form>
</div>
{% endblock %}
