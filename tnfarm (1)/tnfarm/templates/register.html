{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container">
  <div class="form-card {% if role == 'farmer' %}wide{% endif %}">
    <h2 class="form-title">
      {% if role == 'farmer' %}Create your Farmer account{% else %}Create your Customer account{% endif %}
    </h2>
    <form method="post">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" required autofocus>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone">
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required minlength="6">
      </div>

      {% if role == 'farmer' %}
        <hr style="margin:20px 0;border:none;border-top:1px solid #eef0ea;">
        <h3 style="font-size:15px;">Farm details</h3>
        <div class="form-group">
          <label>Farm Name</label>
          <input type="text" name="farm_name" placeholder="e.g. Murugan Organic Farm">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Village</label>
            <input type="text" name="village">
          </div>
          <div class="form-group">
            <label>District</label>
            <select name="district">
              <option value="">Select district</option>
              {% for d in TN_DISTRICTS %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Pincode</label>
          <input type="text" name="pincode">
        </div>
      {% endif %}

      <input type="hidden" name="role" value="{{ role }}">
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
