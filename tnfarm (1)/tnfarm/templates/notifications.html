{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
  <h2>Notifications</h2>
  {% for n in items %}
    <div class="card" style="margin-bottom:10px;">
      <div class="card-body">
        <p class="card-title">{{ n.title }}</p>
        <p class="card-sub">{{ n.description }}</p>
        <span class="badge">{{ n.created_at.strftime('%d %b %Y, %I:%M %p') }}</span>
      </div>
    </div>
  {% else %}
    <p class="empty">No notifications yet.</p>
  {% endfor %}
</div>
{% endblock %}
